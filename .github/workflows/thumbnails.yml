name: YouTube Thumbnails

# ─────────────────────────────────────────────────────────────────────────────
# Runs INSIDE the artwork repo (wesmith1017-lab/yt-thumbnails). Because the
# artwork is checked out alongside the bots, thumbnails are read straight off
# disk (LOCAL_ARTWORK_ROOT) — no artwork PAT, and the auto GITHUB_TOKEN is used
# only to commit updated state back to this repo.
#
# ── WHY THERE ARE FIVE CRON SLOTS PER DAY ────────────────────────────────────
# GitHub's scheduled-run queue is best-effort. Moving off the top of the hour
# (:00 → :20) helped but did not fix it: on 2026-08-14 the single Friday slot
# fired 86 minutes late, and the Thursday slot before it ~2.5 hours late. A
# single cron is one lottery ticket — if GitHub drops or defers it, the day's
# thumbnail is simply late or missed.
#
# So each drop day now has FIVE slots, every 30 minutes from 12:20–14:20 UTC
# (8:20–10:20 AM ET). Scheduled runs are state-based: the first one to land
# uploads the artwork and records the video ID, and every later slot that day
# sees the video already processed and exits in ~15 seconds. Cost is a few
# no-op runs per week; the payoff is that no single delayed or dropped slot
# can lose the day.
#
# ── HOW THE SHOW IS PICKED ───────────────────────────────────────────────────
# Previously the show was looked up from the exact cron string, which meant
# every new slot needed a matching case entry and a typo silently ran nothing.
# The show is now derived from the UTC day-of-week at run time, so slots can be
# added or moved freely. Delays would have to exceed ~9 hours to cross into the
# next UTC day, which has never happened.
#
# Episodes publish at 3 AM ET, so every slot lands well after the drop. Times
# are pinned to Eastern DAYLIGHT offsets; in winter each fires an hour earlier
# in ET, still safely after 3 AM, so no seasonal edits are needed.
#
# Bi-weekly shows (SFS, BSF) and SCC's "last Tuesday of the month" run weekly
# and no-op on empty weeks: every bot returns early when the feed has nothing
# new.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Mon=bdp, Tue=scc+bsf, Thu=was, Fri=sfs — see the day-of-week case below.
    # Wed (Planet Zero) is omitted while the show is between seasons: add a 3
    # to each day list AND set day 3 in the case block to "pz" when S2 starts.
    - cron: '20 12 * * 1,2,4,5'   # ~8:20 AM ET
    - cron: '50 12 * * 1,2,4,5'   # ~8:50 AM ET
    - cron: '20 13 * * 1,2,4,5'   # ~9:20 AM ET
    - cron: '50 13 * * 1,2,4,5'   # ~9:50 AM ET
    - cron: '20 14 * * 1,2,4,5'   # ~10:20 AM ET

  workflow_dispatch:
    inputs:
      show:
        description: 'Show(s) to run now'
        type: choice
        default: all
        options:
          - all      # all active shows (scc, sfs, bsf, was, bdp)
          - auto     # whichever show is scheduled for today (for external schedulers)
          - scc
          - sfs
          - bsf
          - was
          - bdp
          - pz       # not on the schedule; runnable manually
      force:
        description: 'Re-apply artwork even if already processed'
        type: choice
        default: 'yes'
        options:
          - 'yes'    # default for a human clicking "Run workflow" — fixes a stale thumbnail
          - 'no'     # behave like a scheduled run (skip anything already processed)

permissions:
  contents: write   # to commit updated bot/state back to this repo

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # checks out artwork + bot/ together

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Resolve which shows to run
        id: pick
        env:
          SEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.show || 'auto' }}
        run: |
          if [ "$SEL" = "all" ]; then
            shows="scc sfs bsf was bdp"
          elif [ "$SEL" != "auto" ]; then
            shows="$SEL"
          else
            # Derived from the UTC day-of-week (1=Mon … 7=Sun) at run time, so
            # a delayed slot still resolves to the right show.
            case "$(date -u +%u)" in
              1) shows="bdp" ;;
              2) shows="scc bsf" ;;
              3) shows="" ;;          # Planet Zero — set to "pz" when Season 2 starts
              4) shows="was" ;;
              5) shows="sfs" ;;
              *) shows="" ;;
            esac
          fi
          echo "shows=$shows" >> "$GITHUB_OUTPUT"
          echo "Selection: $SEL (UTC day $(date -u +%u)) -> shows: ${shows:-<none>}"

      - name: Run thumbnail bot(s)
        if: steps.pick.outputs.shows != ''
        working-directory: bot
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Artwork is checked out at the repo root; read it from disk (no token).
          LOCAL_ARTWORK_ROOT: ${{ github.workspace }}
          # A human clicking "Run workflow" wants the artwork re-applied, so force
          # defaults to yes. Scheduled runs — and any external scheduler that passes
          # force=no — stay state-based so the retry slots no-op once the day's
          # thumbnail is already up.
          FORCE_REPROCESS: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'no') && '1' || '' }}
        run: |
          set -e
          for s in ${{ steps.pick.outputs.shows }}; do
            echo "::group::$s"
            python "${s}_thumbnail_bot.py"
            echo "::endgroup::"
          done

      - name: Commit updated state
        if: steps.pick.outputs.shows != ''
        run: |
          git config user.name  "yt-thumbnails[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/state/*.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update thumbnail state [skip ci]"
            # The thumbnail is ALREADY uploaded by this point. Saving state back to
            # the repo can lose a race with a concurrent push (rejected non-fast-
            # forward), so rebase onto the latest main and retry. Never fail the run
            # over state: the upload is what matters, and a missed state save just
            # means the next run re-checks the feed (harmless / self-heals).
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push; then pushed="yes"; echo "State pushed (attempt $attempt)."; break; fi
              echo "Push rejected (attempt $attempt); rebasing on origin/main and retrying."
              git pull --rebase --autostash origin main || true
              sleep $((attempt * 3))
            done
            if [ -z "$pushed" ]; then
              echo "::warning::State not pushed after 5 attempts. Thumbnail upload already succeeded; state reconciles next run."
            fi
          fi
