name: YouTube Thumbnails

# ─────────────────────────────────────────────────────────────────────────────
# Runs INSIDE the artwork repo (wesmith1017-lab/yt-thumbnails). Because the
# artwork is checked out alongside the bots, thumbnails are read straight off
# disk (LOCAL_ARTWORK_ROOT) — no artwork PAT, and the auto GITHUB_TOKEN is used
# only to commit updated state back to this repo.
#
# Per-show weekday cadence (mirrors the old laptop schedule). cron is UTC only
# and best-effort: GitHub delays scheduled runs most at the top of the hour, so
# these fire at :20 past (off-peak) to avoid the multi-hour delays / drops seen
# on the old '0 14' slot. Episodes publish at 3 AM ET, so these ~8:20 AM ET runs
# always land well after the drop. Times are pinned to Eastern DAYLIGHT offsets;
# in winter each simply fires an hour earlier in ET, still safely after 3 AM, so
# no seasonal edits are needed.
#
# Bi-weekly shows (SFS, BSF) and SCC's "last Tuesday of the month" run weekly and
# no-op on empty weeks: every bot returns early when the RSS feed has nothing new.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '20 12 * * 2'   # Tue ~8:20 AM ET — Space Crime Continuum + The BIG Sci-Fi Podcast
    - cron: '20 12 * * 5'   # Fri ~8:20 AM ET — SyFy Sistas
    - cron: '20 12 * * 4'   # Thu ~8:20 AM ET — We Are Starfleet
    - cron: '20 12 * * 1'   # Mon ~8:20 AM ET — The Brian Donahue Podcast
    # - cron: '20 12 * * 3' # Wed ~8:20 AM ET — Planet Zero (DISABLED: between seasons)
  workflow_dispatch:
    inputs:
      show:
        description: 'Show(s) to run now'
        type: choice
        default: all
        options:
          - all      # all active shows (scc, sfs, bsf, was, bdp)
          - scc
          - sfs
          - bsf
          - was
          - bdp
          - pz       # disabled on schedule; runnable manually

permissions:
  contents: write   # to commit updated bot/state back to this repo

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # checks out artwork + bot/ together

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Resolve which shows to run
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sel="${{ github.event.inputs.show }}"
            if [ "$sel" = "all" ]; then shows="scc sfs bsf was bdp"; else shows="$sel"; fi
          else
            case "${{ github.event.schedule }}" in
              "20 12 * * 2") shows="scc bsf" ;;
              "20 12 * * 5") shows="sfs" ;;
              "20 12 * * 4") shows="was" ;;
              "20 12 * * 1") shows="bdp" ;;
              "20 12 * * 3") shows="pz" ;;
              *)             shows="" ;;
            esac
          fi
          echo "shows=$shows" >> "$GITHUB_OUTPUT"
          echo "Shows to run: ${shows:-<none>}"

      - name: Run thumbnail bot(s)
        if: steps.pick.outputs.shows != ''
        working-directory: bot
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Artwork is checked out at the repo root; read it from disk (no token).
          LOCAL_ARTWORK_ROOT: ${{ github.workspace }}
          # Manual "Run now" (workflow_dispatch) forces a re-apply of the current
          # artwork, ignoring saved state. Scheduled runs stay state-based so they
          # don't re-upload the same thumbnail every week.
          FORCE_REPROCESS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -e
          for s in ${{ steps.pick.outputs.shows }}; do
            echo "::group::$s"
            python "${s}_thumbnail_bot.py"
            echo "::endgroup::"
          done

      - name: Commit updated state
        if: steps.pick.outputs.shows != ''
        run: |
          git config user.name  "yt-thumbnails[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/state/*.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update thumbnail state [skip ci]"
            # The thumbnail is ALREADY uploaded by this point. Saving state back to
            # the repo can lose a race with a concurrent push (rejected non-fast-
            # forward), so rebase onto the latest main and retry. Never fail the run
            # over state: the upload is what matters, and a missed state save just
            # means the next run re-checks the feed (harmless / self-heals).
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push; then pushed="yes"; echo "State pushed (attempt $attempt)."; break; fi
              echo "Push rejected (attempt $attempt); rebasing on origin/main and retrying."
              git pull --rebase --autostash origin main || true
              sleep $((attempt * 3))
            done
            if [ -z "$pushed" ]; then
              echo "::warning::State not pushed after 5 attempts. Thumbnail upload already succeeded; state reconciles next run."
            fi
          fi
